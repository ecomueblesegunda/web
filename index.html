<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    font-family: monotype corsiva;
    background-image: url('https://img.freepik.com/fotos-premium/fondo-muebles-modernos_469760-19702.jpg');
			background-size: cover; /* Ajusta el tamaño de la imagen */
			background-repeat: no-repeat; /* Evita la repetición de la imagen */
			background-attachment: fixed; /* Fija la imagen en la posición */
			margin: 0; /* Elimina el margen */
			padding: 0; /* Elimina el relleno */
    }
    
        .form-container {
            background: papayawhip;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 300px;
            text-align: center;
        }
     h1{ color:white;}
    
        .h1 {
            text-align: center;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-size: 1.2em;
        }
    
        .form {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
    
        input {
            background:white;
            width: calc(100% - 20px);
            padding: 10px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
            color: black;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
    
        label {
            color: white;
            margin: 10px 0 5px;
            display: block;
            text-align: left;
        }
    
        button {
            margin-top: 20px;
            border-radius: 10px;
            background-color: #9da384;
            height: 40px;
            width: 100%;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
    
        button:hover {
            background-color: rgb(41, 87, 186);
        }
    </style>
<body>
  <!-- Contenido de la página -->
    <div class=“form-container”>
        <h1 class=“h1”>Regístrate para recibir ofertas y promociones</h1>
        <section class=“form”>
        <form action="">
        <label for=“Name”>Usuario</label>
        <input type=“text” id=“Name”>
        <label for=“Email”>Correo</label>
        <input type=“text” id=“Email”>
        <button> <a href="inicio.html">Registrame</a></button>
        </form>
        </section>
        </div>
</body>
</html>
